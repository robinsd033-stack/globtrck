<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Tour Package</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            GlobeTrek Adventures
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="col-md-7 mx-auto card p-4 shadow">

        <h2 class="text-center mb-4">
            Book Your Tour
        </h2>

        <form action="booking.php" method="POST">

            <div class="mb-3">
                <label>Customer Name</label>
                <input type="text" name="customer_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email Address</label>
                <input type="email"  name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Select Tour Package</label>

                <select name="package_name" select class="form-select">

                    <option>Sigiriya Cultural Tour</option>
                    <option>Ella Adventure Tour</option>
                    <option>Galle Beach Holiday</option>
                    <option>Trincomalee Beach Tour</option>
                    <option>Kandy Heritage Tour</option>
                    <option>Nuwara Eliya Tea Country Tour</option>

                </select>
            </div>

            <div class="mb-3">
                <label>Travel Date</label>
                <input type="date" name="travel_date" class="form-control">
            </div>

            <div class="mb-3">
                <label>Number of Travelers</label>
                <input type="number"  name="travelers" class="form-control">
            </div>

            <div class="mb-3">
                <label>Special Requests</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Confirm Booking
            </button>

        </form>

    </div>

</div>

</body>
</html>
