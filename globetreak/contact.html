<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            GlobeTrek Adventures
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <h2>Contact Information</h2>

            <p><strong>Address:</strong> Negombo, Sri Lanka</p>

            <p><strong>Phone:</strong> +94 77 123 4567</p>

            <p><strong>Email:</strong> info@globetrek.com</p>

            <p>
                Contact GlobeTrek Adventures for tour bookings,
                travel inquiries and customized travel plans.
            </p>

        </div>

        <div class="col-md-6">

            <div class="card p-4 shadow">

                <h3 class="mb-4">Send Your Inquiry</h3>

                <form action="contact.php" method="POST">

                    <div class="mb-3">
                        <label>Your Name</label>
                        <input type="text" name="name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Message</label>
                        <textarea name="message" class="form-control" rows="5"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Inquiry
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
