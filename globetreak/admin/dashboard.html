<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            Admin Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        GlobeTrek Administration Panel
    </h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card text-center p-4 shadow">

                <h3>150</h3>

                <p>Total Customers</p>

            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center p-4 shadow">

                <h3>45</h3>

                <p>Total Bookings</p>

            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center p-4 shadow">

                <h3>LKR 850,000</h3>

                <p>Total Revenue</p>

            </div>
        </div>

    </div>

    <div class="mt-5">

        <h3>Recent Bookings</h3>

        <table class="table table-bordered mt-3">

            <tr>
                <th>Customer</th>
                <th>Package</th>
                <th>Date</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>John Silva</td>
                <td>Ella Adventure Tour</td>
                <td>2025-08-15</td>
                <td>Confirmed</td>
            </tr>

            <tr>
                <td>Nimal Perera</td>
                <td>Sigiriya Tour</td>
                <td>2025-08-20</td>
                <td>Pending</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
